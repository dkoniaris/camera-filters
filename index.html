<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0b12">
<title>Φίλτρα Cam — Κάμερα &amp; Εφέ</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png" type="image/png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Κάμερα -->
<video id="video" autoplay playsinline muted></video>

<!-- Σκηνή προβολής -->
<div id="stage">
  <canvas id="display"></canvas>

  <!-- Πάνω μπάρα -->
  <div id="topbar">
    <div id="brand">📸 Φίλτρα Cam</div>
    <div id="topbtns">
      <button class="tbtn" id="btnDemo" title="Δοκιμή χωρίς κάμερα">🧪 Δοκιμή</button>
      <button class="tbtn" id="btnFlip" title="Εναλλαγή κάμερας">🔄</button>
    </div>
  </div>

  <!-- Φόρτωση -->
  <div id="status">Φόρτωση…</div>

  <!-- Οθόνη έναρξης -->
  <div id="startScreen">
    <div class="startCard">
      <div class="startEmoji">📸✨</div>
      <h1>Φίλτρα Cam</h1>
      <p>50+ φίλτρα &amp; εφέ προσώπου<br>σαν Snapchat, Instagram &amp; TikTok</p>
      <button id="btnStart">▶️ Έναρξη Κάμερας</button>
      <button id="btnStartDemo" class="ghost">🧪 Δοκιμή χωρίς κάμερα</button>
      <p class="hint">Χρειάζεται πρόσβαση στην κάμερα για τα εφέ</p>
    </div>
  </div>

  <!-- Κάτω χειριστήρια -->
  <div id="controls">
    <div id="fxRow">
      <button class="fxchip" data-fx="glitch">⚡ Glitch</button>
      <button class="fxchip" data-fx="pixel">▦ Pixel</button>
      <button class="fxchip" data-fx="kaleido">🌀 Καλειδ</button>
      <button class="fxchip" data-fx="duotone">🎨 Duotone</button>
      <button class="fxchip" data-fx="vignette">🌑 Vignette</button>
      <button class="fxchip" id="btnBeauty">✨ Ομορφιά</button>
    </div>

    <div id="effectStrip" class="strip"></div>
    <div id="filterStrip" class="strip"></div>

    <div id="captureRow">
      <button id="btnGallery" title="Οι φωτογραφίες μου">🖼️</button>
      <button id="btnCapture" title="Φωτογραφία"><span></span></button>
      <button id="btnRecord" title="Βίντεο"><span></span></button>
    </div>
  </div>

  <!-- Ρυθμιστικό ομορφιάς -->
  <div id="beautyPanel" class="hidden">
    <label>✨ Ομορφιά (λείανση δέρματος)</label>
    <input type="range" id="beautyRange" min="0" max="100" value="0">
  </div>
</div>

<!-- Γκαλερί -->
<div id="galleryModal" class="modal hidden">
  <div class="modalHead">
    <span>🖼️ Οι φωτογραφίες μου</span>
    <button class="closeBtn" data-close="galleryModal">✕</button>
  </div>
  <div id="galleryGrid"></div>
  <p class="empty" id="galleryEmpty">Δεν έχεις τραβήξει ακόμα φωτογραφία 📷</p>
</div>

<!-- Προβολή φωτογραφίας -->
<div id="viewerModal" class="modal hidden">
  <div class="modalHead">
    <button class="tbtn" id="btnDl">⬇️ Λήψη</button>
    <button class="tbtn" id="btnDel">🗑️ Διαγραφή</button>
    <button class="closeBtn" data-close="viewerModal">✕</button>
  </div>
  <div id="viewerBody"></div>
</div>

<script src="lib/face-api.min.js"></script>
<script src="js/filters.js"></script>
<script src="js/effects.js"></script>
<script src="js/app.js"></script>
</body>
</html>
